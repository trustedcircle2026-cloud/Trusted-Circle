version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - VITE_BASE=/ npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*.js'
      headers:
        - key: Cache-Control
          value: public,max-age=31536000,immutable
    - pattern: '**/*.css'
      headers:
        - key: Cache-Control
          value: public,max-age=31536000,immutable
    - pattern: '**/*.html'
      headers:
        - key: Cache-Control
          value: no-cache
  redirects:
    - source: /agent-portal/
      target: /agent-portal/index.html
      status: '200'
    - source: /agent-portal
      target: /agent-portal/index.html
      status: '200'
    - source: /admin-portal/
      target: /admin-portal/index.html
      status: '200'
    - source: /admin-portal
      target: /admin-portal/index.html
      status: '200'
