<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<script>
(function () {
  'use strict';
  var allowedOrigins = ['https://trustedcircle.shop', 'https://www.trustedcircle.shop'];
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || allowedOrigins.indexOf(event.origin) === -1) return;
    var message = event.data;
    if (!message || typeof message.id !== 'string' || !message.input || typeof message.input.action !== 'string') return;
    google.script.run.withSuccessHandler(function (result) {
      window.parent.postMessage({ id: message.id, result: result }, event.origin);
    }).withFailureHandler(function (error) {
      window.parent.postMessage({ id: message.id, error: error && error.message ? error.message : 'Apps Script request failed.' }, event.origin);
    }).tradersBridgeRequest(message.input);
  });
  var parentOrigin = '*';
  try { var referrerOrigin = new URL(document.referrer).origin; if (allowedOrigins.indexOf(referrerOrigin) !== -1) parentOrigin = referrerOrigin; } catch (ignore) {}
  window.parent.postMessage({ type: 'tc-traders-bridge-ready' }, parentOrigin);
})();
</script></body></html>
