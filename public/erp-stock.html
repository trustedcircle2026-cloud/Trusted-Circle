<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trusted Circle — Payment Link Stock</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7f5;color:#17201c}.app{max-width:1450px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.kicker{font-size:10px;letter-spacing:.12em;font-weight:900;color:#16804d}.top h1{margin:4px 0;font-size:30px;letter-spacing:-.04em}.top p{margin:0;color:#75807b;font-size:12px}.button{border:1px solid #dce5e1;background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#16804d;color:#fff;border-color:#16804d}.card{background:#fff;border:1px solid #e0e7e3;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 8px 28px #14331f08}.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.count{padding:16px;border:1px solid #e1e8e4;background:#fff;border-radius:15px}.count small{display:block;color:#7b8580;font-size:9px}.count b{display:block;font-size:26px;margin:3px 0}.paste{width:100%;height:125px;resize:vertical;border:1px solid #dce5e0;border-radius:12px;padding:12px;font:12px ui-monospace,monospace;outline:none}.paste:focus{border-color:#71c498}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.muted{font-size:10px;color:#7c8782}.sheet{overflow:auto;border:1px solid #e0e6e3;border-radius:12px}.sheet table{width:100%;min-width:800px;border-collapse:collapse;font-size:11px}.sheet th{background:#f4f7f5;text-align:left;padding:10px;font-size:9px;color:#68736e;text-transform:uppercase;letter-spacing:.08em}.sheet td{padding:7px 9px;border-top:1px solid #edf1ef}.sheet input,.sheet select{width:100%;padding:8px;border:1px solid #dfe6e2;border-radius:7px;background:#fff;font:11px inherit}.status{display:inline-block;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900}.available{background:#e9f8ef;color:#147b4d}.reserved{background:#fff5dc;color:#866000}.used{background:#edf0f7;color:#45526e}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:430px;width:100%}.login input{width:100%;height:46px;margin:7px 0 14px;border:1px solid #dfe6e2;border-radius:10px;padding:0 12px}.message{margin-top:12px;padding:10px;border-radius:9px;background:#edf8f2;color:#14734a;font-size:11px;font-weight:700}.error{background:#fff0f0;color:#a64c4c}@media(max-width:700px){.app{padding:16px}.counts{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="root"></div><script>const API='https://script.google.com/macros/s/AKfycbxkIICfsVN783oq04KPBTN73ATEYaBuMXPaPCDsbnvP4uTHFDKH2wglKNAj2nWo5He9/exec';const D=[500,1000,1500,2000];const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const $=id=>document.getElementById(id);let token=localStorage.getItem('tc_erp_session')||'',stock=[];async function api(action,params={},method='POST'){const r=await fetch(API,{method,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...params})});const j=await r.json();if(!j.ok)throw Error(j.error?.message||'Request failed');return j.data}async function login(){try{const d=await api('adminLogin',{email:$('email').value,password:$('password').value});token=d.session.token;localStorage.setItem('tc_erp_session',token);renderApp();await refresh()}catch(e){$('msg').textContent=e.message;$('msg').className='message error'}}function loginView(){document.body.innerHTML='<div class="login"><div class="card"><span class="kicker">TRUSTED CIRCLE · ERP</span><h2>Payment Link Stock</h2><p class="muted">Private admin stock management.</p><label>Email</label><input id="email" type="email" value="trustedcircle2026@gmail.com"><label>Password</label><input id="password" type="password"><button class="button primary" style="width:100%" onclick="login()">Enter ERP</button><div id="msg"></div></div></div>'}function renderApp(){document.body.innerHTML='<main class="app"><div class="top"><div><span class="kicker">PAYMENT LINKS</span><h1>Link stock</h1><p>Stock links by value. Matching links are reserved automatically for orders.</p></div><button class="button" onclick="refresh()">Refresh</button></div><div id="counts" class="counts"></div><section class="card"><span class="kicker">BULK ADD</span><h3>Paste from Excel</h3><p class="muted">One row per link: Amount · Payment Link · Label. Use tabs when copying from Excel or Google Sheets.</p><textarea id="paste" class="paste" placeholder="500\thttps://...\tPay securely\n1000\thttps://...\tPay securely"></textarea><div class="actions"><button class="button" onclick="loadRows()">Load rows</button><span id="ready" class="muted">0 links ready</span></div></section><section class="card"><div class="actions"><div><span class="kicker">NEW STOCK</span><h3>Rows to add</h3></div><button class="button" onclick="addRow()">+ Add row</button></div><div class="sheet"><table><thead><tr><th>#</th><th>Amount</th><th>Payment Link</th><th>Label</th><th></th></tr></thead><tbody id="newRows"></tbody></table></div><div class="actions"><span id="msg" class="muted"></span><button class="button primary" onclick="submitRows()">Add to stock</button></div></section><section class="card"><div class="actions"><div><span class="kicker">LIVE STOCK</span><h3>Stock status</h3></div></div><div class="sheet"><table><thead><tr><th>Amount</th><th>Payment Link</th><th>Status</th><th>Order</th></tr></thead><tbody id="liveRows"></tbody></table></div></section></main>';window.newRows=[{denomination:500,link:'',label:'Pay securely'}];drawNew()}function addRow(){newRows.push({denomination:500,link:'',label:'Pay securely'});drawNew()}function removeRow(i){newRows.splice(i,1);if(!newRows.length)newRows=[{denomination:500,link:'',label:'Pay securely'}];drawNew()}function edit(i,k,v){newRows[i][k]=k==='denomination'?Number(v):v;updateReady()}function drawNew(){$('newRows').innerHTML=newRows.map((r,i)=>'<tr><td>'+Number(i+1)+'</td><td><select onchange="edit('+i+',\'denomination\',this.value)">'+D.map(x=>'<option '+(x===r.denomination?'selected':'')+' value="'+x+'">'+money(x)+'</option>').join('')+'</select></td><td><input value="'+esc(r.link)+'" oninput="edit('+i+',\'link\',this.value)" placeholder="https://payment-link"></td><td><input value="'+esc(r.label)+'" oninput="edit('+i+',\'label\',this.value)"></td><td><button class="button" onclick="removeRow('+i+')">×</button></td></tr>').join('');updateReady()}function updateReady(){$('ready').textContent=newRows.filter(r=>r.link.trim()).length+' links ready'}function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}function loadRows(){const lines=$('paste').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);newRows=lines.map(line=>{const p=line.split(/\t|,|\s{2,}/).map(x=>x.trim());const n=Number(String(p[0]||'').replace(/[^0-9]/g,''));return{denomination:D.includes(n)?n:500,link:p[1]||'',label:p[2]||'Pay securely'}});if(!newRows.length)newRows=[{denomination:500,link:'',label:'Pay securely'}];$('paste').value='';drawNew()}async function submitRows(){const rows=newRows.filter(r=>r.link.trim());if(!rows.length){setMsg('Add at least one link',true);return}try{const d=await api('adminAddPaymentLinkStockBulk',{token,rows});setMsg((d.added||0)+' added. '+(d.skipped||0)+' duplicates skipped.');newRows=[{denomination:500,link:'',label:'Pay securely'}];drawNew();await refresh()}catch(e){setMsg(e.message,true)}}function setMsg(t,bad){$('msg').textContent=t;$('msg').className=bad?'message error':'message'}async function refresh(){try{const d=await api('adminDashboard',{token});stock=d.tables?.PaymentLinkStock?.rows||[];drawCounts();$('liveRows').innerHTML=stock.map(r=>'<tr><td><b>'+money(r.Denomination)+'</b></td><td title="'+esc(r.Link)+'">'+esc(r.Link)+'</td><td><span class="status '+String(r.Status||'').toLowerCase()+'">'+esc(r.Status)+'</span></td><td>'+(r.OrderID?'Assigned':'—')+'</td></tr>').join('')||'<tr><td colspan="4">No stock yet.</td></tr>'}catch(e){if(/session|authentication|admin/i.test(e.message)){localStorage.removeItem('tc_erp_session');token='';loginView()}else setMsg(e.message,true)}}function drawCounts(){const c=D.reduce((o,d)=>(o[d]=stock.filter(r=>Number(r.Denomination)===d&&String(r.Status||'').toUpperCase()==='AVAILABLE').length,o),{});$('counts').innerHTML=D.map(d=>'<div class="count"><small>'+money(d)+'</small><b>'+c[d]+'</b><small>available</small></div>').join('')}if(token){renderApp();refresh()}else loginView()</script></body></html>
