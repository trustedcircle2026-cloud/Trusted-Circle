<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Trusted Circle Books — cloud accounting and financial management." />
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/trustedcircle2026-cloud/Trusted-Circle/main/Logo%20new.jpg" />
    <title>Trusted Circle Books</title>
    <style>
      html,body{margin:0;min-height:100%;background:#f6f8fb;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033}
      #books-root{min-height:100vh}
      .books-boot{min-height:100vh;display:grid;place-items:center;background:#f6f8fb}
      .books-boot-card{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e5e9ef;border-radius:14px;padding:18px 22px;box-shadow:0 8px 30px #1720330b;font-size:13px}
      .books-boot-card img{width:42px;height:42px;object-fit:contain;border-radius:10px}
      .books-boot-card span{display:block;color:#7a8495;font-size:11px;margin-top:3px}
      .books-boot-error{max-width:560px;margin:40px auto;padding:24px;background:#fff;border:1px solid #f0d2d2;border-radius:14px;box-shadow:0 8px 30px #1720330b}
      .books-boot-error h2{margin:0 0 8px;font-size:18px}.books-boot-error p{color:#6e798a;font-size:12px;line-height:1.6}.books-boot-error button{border:0;background:#172033;color:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="books-root"><div class="books-boot"><div class="books-boot-card"><img src="https://raw.githubusercontent.com/trustedcircle2026-cloud/Trusted-Circle/main/Logo%20new.jpg" alt="Trusted Circle"/><div><b>Opening Trusted Circle Books…</b><span>Loading your secure accounting workspace</span></div></div></div></div>
    <script>
      window.addEventListener('error',function(e){var root=document.getElementById('books-root');if(root&&!root.dataset.appMounted){root.innerHTML='<div class="books-boot-error"><h2>Trusted Circle Books could not load</h2><p>The application reported a frontend loading error. Refresh once after the latest deployment finishes.</p><button onclick="location.reload()">Refresh Books</button></div>'}})
      window.addEventListener('unhandledrejection',function(){})
    </script>
    <script type="module" src="/src/books-main.jsx"></script>
  </body>
</html>
