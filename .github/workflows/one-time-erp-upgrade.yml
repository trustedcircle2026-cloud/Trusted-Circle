name: One-time ERP Admin Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply ERP admin upgrade') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ERP
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/api.js')
          s=p.read_text()
          s=s.replace("adminDashboard:token=>requestWithRetry('adminDashboard',{token}),", "adminDashboard:token=>requestWithRetry('adminDashboard',{token}),adminTable:(token,sheet)=>requestWithRetry('adminTable',{token,sheet}),")
          p.write_text(s)

          p=Path('backend/apps-script/Code.gs')
          s=p.read_text()
          s=s.replace("case'adminDashboard':return adminDashboard_(input);", "case'adminDashboard':return adminDashboard_(input);case'adminTable':return adminTable_(input);")
          p.write_text(s)

          p=Path('backend/apps-script/AdminService.gs')
          s=p.read_text()
          start=s.index('function adminDashboard_')
          end=s.index('function getSheetHeaders_', start)
          replacement=r'''function adminCachedRows_(name){var key='tc_admin_rows_'+String(name);var cache=CacheService.getScriptCache(),hit=cache.get(key);if(hit){try{return JSON.parse(hit);}catch(e){}}var rows=getRows_(TC_CONFIG.SHEETS[name]||name);try{cache.put(key,JSON.stringify(rows),12);}catch(e){}return rows;}
          function adminDashboard_(data){
            var admin=adminAuthenticate_(data.token),names=['Users','Orders','Payments','PaymentLinkRequests','Vouchers','Products','Brands','Cart','Notifications'];
            var raw={};names.forEach(function(name){raw[name]=adminCachedRows_(name);});
            var tables={};['Users','Orders','Payments','PaymentLinkRequests','Vouchers','Products','Brands'].forEach(function(name){var rows=raw[name]||[];tables[name]={idField:TC_ADMIN_SHEETS[name],columns:rows.length?Object.keys(rows[0]):getSheetHeaders_(name),rows:rows.slice(-120).reverse()};});
            var orders=raw.Orders||[],users=raw.Users||[],payments=raw.Payments||[],requests=raw.PaymentLinkRequests||[],vouchers=raw.Vouchers||[];
            var worklist=[];
            orders.forEach(function(r){var st=String(r.Status||'').toUpperCase();if(['PENDING_PAYMENT','PAYMENT_PROCESSING','PROCESSING'].indexOf(st)>=0)worklist.push({sheet:'Orders',type:'Order',priority:st==='PENDING_PAYMENT'?'High':'Normal',title:'Order '+(r.OrderNumber||'needs attention'),detail:st.replaceAll('_',' ')+' · ₹'+Number(r.Total||0).toLocaleString('en-IN'),status:st,when:r.UpdatedAt||r.CreatedAt,recordId:r.OrderID});});
            payments.forEach(function(r){var st=String(r.Status||'').toUpperCase();if(['PENDING','PROCESSING'].indexOf(st)>=0)worklist.push({sheet:'Payments',type:'Payment',priority:'High',title:'Payment needs review',detail:(r.Provider||'Payment')+' · ₹'+Number(r.Amount||0).toLocaleString('en-IN'),status:st,when:r.UpdatedAt||r.CreatedAt,recordId:r.PaymentID});});
            requests.forEach(function(r){var st=String(r.Status||'').toUpperCase();if(['REQUESTED','PROCESSING'].indexOf(st)>=0)worklist.push({sheet:'PaymentLinkRequests',type:'Payment link',priority:'High',title:'Payment link request',detail:st.replaceAll('_',' '),status:st,when:r.UpdatedAt||r.CreatedAt,recordId:r.RequestID});});
            vouchers.forEach(function(r){var st=String(r.Status||'').toUpperCase();if(['PENDING','PROCESSING'].indexOf(st)>=0)worklist.push({sheet:'Vouchers',type:'Voucher',priority:'High',title:'Voucher needs delivery',detail:st.replaceAll('_',' '),status:st,when:r.IssuedAt||r.CreatedAt,recordId:r.VoucherID});});
            (raw.Notifications||[]).forEach(function(r){if(!r.ReadAt)worklist.push({sheet:'Notifications',type:'Notification',priority:'Normal',title:r.Title||'Unread notification',detail:r.Message||'Unread notification',status:'UNREAD',when:r.CreatedAt,recordId:r.NotificationID});});
            (raw.Cart||[]).forEach(function(r){if(Number(r.Quantity||0)>0)worklist.push({sheet:'Cart',type:'Cart',priority:'Low',title:'Open cart item',detail:'Quantity '+Number(r.Quantity||0),status:'OPEN',when:r.UpdatedAt||r.CreatedAt,recordId:r.CartID});});
            worklist.sort(function(a,b){return String(b.when||'').localeCompare(String(a.when||''));});
            var paidStatuses=['PAID','PROCESSING','DELIVERED'],paidOrders=orders.filter(function(r){return paidStatuses.indexOf(String(r.Status||'').toUpperCase())>=0;});
            var grossSales=paidOrders.reduce(function(sum,r){return sum+Number(r.Subtotal||r.Total||0);},0),discounts=paidOrders.reduce(function(sum,r){return sum+Number(r.Discount||0);},0),collected=payments.filter(function(r){return ['VERIFIED','PAID','CAPTURED'].indexOf(String(r.Status||'').toUpperCase())>=0;}).reduce(function(sum,r){return sum+Number(r.Amount||0);},0),refundedOrders=orders.filter(function(r){return String(r.Status||'').toUpperCase()==='REFUNDED';}),refunds=refundedOrders.reduce(function(sum,r){return sum+Number(r.Total||0);},0);
            var status={};orders.forEach(function(r){var st=String(r.Status||'UNKNOWN').toUpperCase();status[st]=(status[st]||0)+1;});
            var byUser={};orders.forEach(function(r){var uid=String(r.UserID||'');if(!uid)return;if(!byUser[uid])byUser[uid]={userId:uid,orders:0,paidOrders:0,pendingOrders:0,deliveredOrders:0,value:0};var x=byUser[uid],st=String(r.Status||'').toUpperCase();x.orders++;if(st==='PAID'||st==='PROCESSING'||st==='DELIVERED'){x.paidOrders++;x.value+=Number(r.Total||0);}if(st==='PENDING_PAYMENT'||st==='PAYMENT_PROCESSING'){x.pendingOrders++;}if(st==='DELIVERED')x.deliveredOrders++;});
            var userMap={};users.forEach(function(u){userMap[String(u.UserID)]={name:u.Name||'Shopper',email:u.Email||''};});
            var shopperReport=Object.keys(byUser).map(function(uid){var x=byUser[uid],u=userMap[uid]||{};return{name:u.name||'Shopper',email:u.email||'',userId:uid,orders:x.orders,paidOrders:x.paidOrders,pendingOrders:x.pendingOrders,deliveredOrders:x.deliveredOrders,value:x.value};}).sort(function(a,b){return b.value-a.value;}).slice(0,100);
            var metrics={shoppers:users.filter(function(r){return String(r.Role||'').toUpperCase()!=='ADMIN';}).length,orders:orders.length,pendingOrders:orders.filter(function(r){return String(r.Status||'').toUpperCase()==='PENDING_PAYMENT';}).length,paidOrders:paidOrders.length,revenue:collected};
            var result={admin:publicUser_(admin),tables:tables,metrics:metrics,worklist:worklist.slice(0,100),sheetCounts:{},reports:{pnl:{grossSales:grossSales,discounts:discounts,collected:collected,refunds:refunds,paidOrders:paidOrders.length,refundedOrders:refundedOrders.length},status:status},shopperReport:shopperReport};
            names.forEach(function(name){result.sheetCounts[name]=(raw[name]||[]).length;});
            return result;
          }
          function adminTable_(data){adminAuthenticate_(data.token);var sheetName=cleanText_(data.sheet,60),idField=TC_ADMIN_SHEETS[sheetName];require_(idField,'Unknown ERP sheet.');var rows=adminCachedRows_(sheetName);return{sheet:sheetName,table:{idField:idField,columns:rows.length?Object.keys(rows[0]):getSheetHeaders_(sheetName),rows:rows.slice(-500).reverse()}};}
          '''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)

          p=Path('src/ErpApp.jsx')
          s=p.read_text()
          s=s.replace("import { Activity, ArrowLeft, ArrowRight, Check, ChevronRight, CircleDollarSign, ClipboardList, Copy, Database, ExternalLink, FileText, KeyRound, LayoutDashboard, Link2, LogOut, Menu, PackageCheck, Pencil, RefreshCw, Search, Send, ShieldCheck, ShoppingCart, Table2, Users, X } from 'lucide-react'", "import { Activity, ArrowLeft, ArrowRight, BarChart3, Check, ChevronRight, CircleDollarSign, ClipboardList, Copy, Database, ExternalLink, FileText, KeyRound, LayoutDashboard, Link2, ListTodo, LogOut, Menu, PackageCheck, Pencil, RefreshCw, Search, Send, ShieldCheck, ShoppingCart, Table2, Users, X } from 'lucide-react'")
          s=s.replace("import './erp.css'", "import './erp.css'\nimport { AllData, Reports, Worklist } from './ErpInsights'")
          s=s.replace("const SHEET_LABELS={Users:'Shoppers'", "const SHEET_LABELS={worklist:'Pending Work',reports:'Reports','all-data':'All Data',Users:'Shoppers'")
          s=s.replace("const MENU=[['dashboard','Dashboard',LayoutDashboard]", "const MENU=[['dashboard','Dashboard',LayoutDashboard],['worklist','Pending Work',ListTodo],['reports','Reports',BarChart3],['all-data','All Data',Table2]")
          s=s.replace("useEffect(()=>{if(token&&visible)loadDashboard(token)},[token,visible])", "useEffect(()=>{if(!token||!visible)return;if(!data)loadDashboard(token);else if(!['dashboard','worklist','reports','all-data'].includes(active)&&!data.tables?.[active])loadTable(active)},[token,visible,active])")
          marker="async function loadDashboard(t=token){setLoading(true);setError('');try{const result=await api.adminDashboard(t);setData(result);setUser(result.admin);setActive(a=>a||'dashboard')}catch(e){localStorage.removeItem('tc_erp_session');setToken('');setUser(null);setData(null);setError(e.message||'ERP session expired.')}finally{setLoading(false)}}"
          s=s.replace(marker,marker+"\n async function loadTable(sheet=active){setLoading(true);try{const result=await api.adminTable(token,sheet);setData(prev=>({...prev,tables:{...(prev?.tables||{}),[sheet]:result.table}}))}catch(e){setError(e.message||'Could not load data.')}finally{setLoading(false)}}")
          s=s.replace("<span>{label}</span>{active===id&&<ChevronRight size={14}/>}", "<span>{label}</span>{id==='worklist'&&data?.worklist?.length>0&&<b className=\"erp-menu-badge\">{Math.min(data.worklist.length,99)}</b>}{active===id&&<ChevronRight size={14}/>}")
          target=":active==='dashboard'?<Dashboard metrics={metrics} orders={orders} pending={pendingOrders} onOrders={()=>setActive('Orders')} onPayLinks={()=>setActive('PaymentLinks')} onVouchers={()=>setActive('Vouchers')} onRequests={()=>setActive('PaymentLinkRequests')} onConfirm={id=>setConfirm({orderId:id,status:'',quick:false})}/>:active==='PaymentLinks'?"
          replacement=":active==='dashboard'?<Dashboard metrics={metrics} orders={orders} pending={pendingOrders} onOrders={()=>setActive('Orders')} onPayLinks={()=>setActive('PaymentLinks')} onVouchers={()=>setActive('Vouchers')} onRequests={()=>setActive('PaymentLinkRequests')} onConfirm={id=>setConfirm({orderId:id,status:'',quick:false})}/>:active==='worklist'?<Worklist items={data?.worklist||[]} onOpen={sheet=>setActive(sheet)}/>:active==='reports'?<Reports reports={data?.reports||{}} shopperReport={data?.shopperReport||[]}/>:active==='all-data'?<AllData tables={data?.tables||{}} onOpen={sheet=>setActive(sheet)}/>:active==='PaymentLinks'?"
          if target not in s: raise SystemExit('render target not found')
          s=s.replace(target,replacement)
          p.write_text(s)

          p=Path('src/erp.css')
          s=p.read_text()
          if '.erp-menu-badge{' not in s:
              s += "\n.erp-menu-badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#ffede8;color:#a23f38;display:grid;place-items:center;font-size:7px;font-weight:900}.erp-menu-item.active .erp-menu-badge{background:#fff;color:#18794d}.erp-menu-item.active svg:last-child{margin-left:0}\n"
          p.write_text(s)
          PY
          rm -f .github/workflows/one-time-erp-upgrade.yml
      - name: Commit upgrade
        run: |
          git config user.name "trustedcircle2026-cloud"
          git config user.email "trustedcircle2026-cloud@users.noreply.github.com"
          git add src/api.js src/ErpApp.jsx src/erp.css backend/apps-script/Code.gs backend/apps-script/AdminService.gs .github/workflows/one-time-erp-upgrade.yml
          git commit -m "Apply ERP admin upgrade"
          git push
