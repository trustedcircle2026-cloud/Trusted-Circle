name: Repair remaining build syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    if: ${{ github.actor == 'trustedcircle2026-cloud' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair template literal syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'src/ErpInsights.jsx': [
              ("const money=v=>`₹${Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})`", "const money=v=>`₹${Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`"),
              ("const money=value=>`₹${Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2})`", "const money=value=>`₹${Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`")
            ]
          }
          changed=False
          for name,pairs in replacements.items():
            p=Path(name); text=p.read_text()
            for old,new in pairs:
              if old in text:
                text=text.replace(old,new,1); changed=True
            p.write_text(text)
          if not changed:
            raise SystemExit('No repair target found.')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "trustedcircle2026-cloud"
          git config user.email "trustedcircle2026@gmail.com"
          git add src/ErpInsights.jsx
          git rm .github/workflows/repair-build-2.yml
          git commit -m "Fix remaining ERP JSX syntax"
          git push origin main
      - name: Trigger deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Trusted Circle to GitHub Pages" --ref main
