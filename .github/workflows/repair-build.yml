name: Repair build syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  repair:
    if: ${{ github.actor == 'trustedcircle2026-cloud' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair known JSX template syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'src/ErpApp.jsx': ("const money=v=>`₹${Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})`", "const money=v=>`₹${Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`"),
            'src/pages/OrderPlacedPage.jsx': ("const money=value=>`₹${Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2})`", "const money=value=>`₹${Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:2})}`")
          }
          changed=False
          for name,(old,new) in replacements.items():
            p=Path(name); text=p.read_text()
            if old in text:
              p.write_text(text.replace(old,new,1)); changed=True
          if not changed:
            raise SystemExit('No syntax repair was necessary.')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "trustedcircle2026-cloud"
          git config user.email "trustedcircle2026@gmail.com"
          git add src/ErpApp.jsx src/pages/OrderPlacedPage.jsx
          git rm .github/workflows/repair-build.yml
          git commit -m "Fix JSX template literal syntax"
          git push origin main
      - name: Trigger deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy Trusted Circle to GitHub Pages" --ref main
