<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c20"><title>Trusted Circle — Shopping Admin Add Link</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f8f5;color:#173b2a;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:24px auto;padding:16px}.top,.card{background:#fff;border:1px solid #dfe9e3;border-radius:20px;box-shadow:0 12px 35px rgba(20,54,40,.07)}.top{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:50px;height:50px;object-fit:contain;border-radius:13px}.brand h1{margin:0;font-size:25px}.brand p{margin:4px 0 0;color:#74817a;font-size:12px}.badge{padding:9px 12px;border-radius:999px;background:#eef7f0;color:#14734d;border:1px solid #d7e9dc;font-size:10px;font-weight:900;white-space:nowrap}.card{padding:22px;margin-bottom:16px}h2{margin:0 0 15px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:12px;font-weight:900;margin-bottom:7px;color:#34463d}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd9d2;border-radius:11px;font:inherit;background:#fff;color:#173b2a;outline:none}input:focus,select:focus,textarea:focus{border-color:#0f7a4b;box-shadow:0 0 0 3px rgba(15,122,75,.08)}textarea{min-height:145px;resize:vertical;line-height:1.5}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}button{border:0;border-radius:11px;padding:11px 16px;min-height:42px;background:#0f5132;color:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}button.alt{background:#e8f0eb;color:#173b2a}button:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;margin-top:12px;padding:11px 13px;border-radius:10px;font-size:13px}.msg.show{display:flex;align-items:center;gap:9px}.msg.ok{background:#eef7f0;color:#14734d}.msg.bad{background:#fff0ee;color:#a52217}.counter{display:flex;justify-content:space-between;align-items:center;margin:9px 0 0;font-size:11px;color:#74817a}.counter strong{color:#14734d}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sum{padding:14px;border:1px solid #e0e9e4;border-radius:13px;background:#f9fbfa}.sum b{display:block;font-size:21px}.sum span{font-size:11px;color:#74817a}.sum small{display:block;margin-top:4px;color:#617069;font-size:10px}.summary-note{display:flex;justify-content:space-between;align-items:center;margin:13px 0 0;padding:10px 12px;border-radius:10px;background:#f6f9f7;color:#617069;font-size:11px}.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.filters input{max-width:320px}.filters select{width:auto;min-width:150px}.refresh-state{margin-left:auto;color:#74817a;font-size:11px}.table-wrap{overflow:auto;margin-top:12px;border:1px solid #e3ebe6;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:10px;border-bottom:1px solid #e8ece9;text-align:left;font-size:12px;vertical-align:top}th{background:#f6f9f7;color:#617069;position:sticky;top:0}tr:last-child td{border-bottom:0}.status{font-weight:900}.available{color:#14734d}.reserved{color:#a66a00}.used{color:#6e7773}.removed{color:#b42318}.url{max-width:330px;word-break:break-all}.empty{text-align:center!important;color:#74817a;padding:28px!important}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.wrap{padding:12px}.top{align-items:flex-start}.brand h1{font-size:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.summary{grid-template-columns:1fr 1fr}.refresh-state{width:100%;margin-left:0}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><img src="https://raw.githubusercontent.com/trustedcircle2026-cloud/Trusted-Circle/main/Logo%20new.jpg" alt="Trusted Circle"><div><h1>Trusted Circle</h1><p>SHOPPING PAYMENT GATEWAY</p></div></div><div class="badge">ADMIN ONLY · SHOPPING</div></header>
<section class="card"><h2>Add Payment Link Stock</h2><div class="grid">
<div><label>Shopping Admin Key</label><input id="key" type="password" placeholder="Private admin key" autocomplete="off"></div>
<div><label>Denomination</label><select id="amount"><option value="500">₹500</option><option value="1000">₹1,000</option><option value="1500">₹1,500</option><option value="2000">₹2,000</option></select></div>
<div><label>Payment Link Label</label><input id="label" value="Shopping Payment ₹500" placeholder="Shopping Payment ₹500"></div>
<div><label>Single Payment Gateway Link</label><input id="link" type="url" placeholder="https://..."></div>
<div class="full"><label>Bulk Payment Gateway Links — one link per line</label><textarea id="links" placeholder="https://payment-link-1&#10;https://payment-link-2"></textarea></div></div>
<div class="actions"><button id="singleBtn" onclick="single()">Add Single Link</button><button id="bulkBtn" onclick="bulk()">Add Bulk Links</button><button class="alt" id="refreshBtn" onclick="refresh()">↻ Refresh Stock</button></div>
<div class="counter"><span id="bulkCount"><strong>0</strong> valid bulk links detected</span><span id="invalidCount"></span></div><div id="msg" class="msg"></div></section>
<section class="card"><h2>Shopping Payment-Link Stock Summary</h2><div id="summary" class="summary"></div><div class="summary-note"><span id="stockCount">No stock loaded</span><span id="lastRefresh">—</span></div>
<div class="filters"><input id="search" placeholder="Search link, transaction or ID…" oninput="render()"><select id="statusFilter" onchange="render()"><option value="">All statuses</option><option>AVAILABLE</option><option>RESERVED</option><option>USED</option><option>REMOVED</option></select><select id="denomFilter" onchange="render()"><option value="">All denominations</option><option value="500">₹500</option><option value="1000">₹1,000</option><option value="1500">₹1,500</option><option value="2000">₹2,000</option></select><span class="refresh-state" id="refreshState">Loading current stock…</span></div>
<div class="table-wrap"><table><thead><tr><th>Denomination</th><th>Status</th><th>Stock ID</th><th>Transaction / Order</th><th>Expires</th><th>Payment Link</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Loading stock…</td></tr></tbody></table></div></section></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxkIICfsVN783oq04KPBTN73ATEYaBuMXPaPCDsbnvP4uTHFDKH2wglKNAj2nWo5He9/exec';const DENOMS=[500,1000,1500,2000];let stockRows=[],busy=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function showMsg(t,b=false){const e=$('msg');e.className='msg show '+(b?'bad':'ok');e.textContent=t}function setBusy(v){busy=v;['singleBtn','bulkBtn','refreshBtn'].forEach(id=>$(id).disabled=v);if(v)$('refreshState').textContent='Working…'}
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8','Accept':'application/json'},body:JSON.stringify({action,adminKey:$('key').value,...extra}),cache:'no-store'});const j=await r.json();if(!j.ok)throw Error(j.error?.message||j.error||'Request failed');return j.data}
async function login(){if(!$('key').value.trim())throw Error('Enter the Shopping Admin Key.');const r=await api('adminLogin',{email:'trustedcircle2026@gmail.com',password:$('key').value.trim()});return r.session.token}
function parsed(){return $('links').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function updateCounter(){const p=parsed(),v=p.filter(x=>/^https:\/\//i.test(x));$('bulkCount').innerHTML='<strong>'+v.length+'</strong> valid bulk link'+(v.length===1?'':'s')+' detected';const bad=p.length-v.length;$('invalidCount').textContent=bad?bad+' invalid':''}
$('links').addEventListener('input',updateCounter);$('amount').addEventListener('change',()=>{if(!$('label').value||/^Shopping Payment ₹\d+$/.test($('label').value))$('label').value='Shopping Payment ₹'+$('amount').value});updateCounter();
async function single(){if(busy)return;setBusy(true);try{const link=$('link').value.trim();if(!/^https:\/\//i.test(link))throw Error('Enter a valid HTTPS payment gateway link.');const token=await login();const r=await api('adminAddPaymentLinkStock',{token,denomination:+$('amount').value,link,label:$('label').value.trim()||'Pay securely'});showMsg('Payment link added successfully. Stock ID: '+(r?.paymentLinkStockId||'—'));$('link').value='';await refresh(token)}catch(e){showMsg(e.message,true)}finally{setBusy(false)}}
async function bulk(){if(busy)return;setBusy(true);try{const all=parsed(),valid=all.filter(x=>/^https:\/\//i.test(x));if(!valid.length)throw Error('Paste at least one valid HTTPS payment link, one per line.');if(valid.length>200)throw Error('Maximum 200 payment links can be added at once.');const token=await login();const r=await api('adminAddPaymentLinkStockBulk',{token,rows:valid.map(link=>({denomination:+$('amount').value,link,label:$('label').value.trim()||'Pay securely'}))});showMsg((r?.added||0)+' links added successfully. '+(r?.skipped||0)+' duplicate links skipped.');if((r?.added||0)>0)$('links').value='';updateCounter();await refresh(token)}catch(e){showMsg(e.message,true)}finally{setBusy(false)}}
async function refresh(existingToken){if(busy&&!existingToken)return;const wasBusy=busy;if(!wasBusy)setBusy(true);try{const token=existingToken||await login();const r=await api('adminTable',{token,sheet:'PaymentLinkStock'});stockRows=Array.isArray(r?.rows)?r.rows:Array.isArray(r)?r:[];renderSummary();render();$('lastRefresh').textContent='Last refreshed: '+new Date().toLocaleString('en-IN');$('refreshState').textContent='Live stock loaded';if(!wasBusy)showMsg('Stock refreshed successfully. '+stockRows.length+' records loaded.')}catch(e){showMsg(e.message,true);$('refreshState').textContent='Refresh failed'}finally{if(!wasBusy)setBusy(false)}}
function val(x,a,b){return x?.[a]??x?.[b]??''}function renderSummary(){$('summary').innerHTML=DENOMS.map(d=>{const rows=stockRows.filter(x=>Number(val(x,'Denomination','denomination'))===d);const a=rows.filter(x=>String(val(x,'Status','status')).toUpperCase()==='AVAILABLE').length;const r=rows.filter(x=>String(val(x,'Status','status')).toUpperCase()==='RESERVED').length;const u=rows.filter(x=>String(val(x,'Status','status')).toUpperCase()==='USED').length;return '<div class="sum"><b>'+a+'</b><span>₹'+d.toLocaleString('en-IN')+' available</span><small>'+r+' reserved · '+u+' used · '+rows.length+' total</small></div>'}).join('')}
function render(){const q=$('search').value.trim().toLowerCase(),sf=$('statusFilter').value,df=$('denomFilter').value;const rows=stockRows.filter(x=>{const d=String(val(x,'Denomination','denomination')),s=String(val(x,'Status','status')).toUpperCase();const text=[val(x,'PaymentLinkStockID','paymentLinkStockId'),val(x,'OrderID','orderId'),val(x,'TransactionID','transactionId'),val(x,'PaymentLink','paymentLink'),val(x,'Link','link')].join(' ').toLowerCase();return(!q||text.includes(q))&&(!sf||s===sf)&&(!df||d===df)}).slice().reverse();$('stockCount').textContent=rows.length+' matching record'+(rows.length===1?'':'s')+' · '+stockRows.length+' total';$('rows').innerHTML=rows.length?rows.map(x=>{const d=Number(val(x,'Denomination','denomination')||0),s=String(val(x,'Status','status')||'').toUpperCase(),id=val(x,'PaymentLinkStockID','paymentLinkStockId')||'—',tx=val(x,'OrderID','orderId')||val(x,'TransactionID','transactionId')||'—',ex=val(x,'ExpiresAt','expiresAt'),link=val(x,'PaymentLink','paymentLink')||val(x,'Link','link')||'—';return '<tr><td>₹'+d.toLocaleString('en-IN')+'</td><td><span class="status '+s.toLowerCase()+'">'+esc(s||'—')+'</span></td><td>'+esc(id)+'</td><td>'+esc(tx)+'</td><td>'+esc(ex?new Date(ex).toLocaleString('en-IN'):'—')+'</td><td class="url">'+esc(link)+'</td></tr>'}).join(''):'<tr><td colspan="6" class="empty">No records match the selected filters.</td></tr>'}
refresh();
</script></body></html>
